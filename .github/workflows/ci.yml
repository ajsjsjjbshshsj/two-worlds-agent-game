name: CI

on:
  pull_request:
    branches: [codex/bootstrap]
  push:
    branches: [codex/bootstrap]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-static:
    name: Backend / ${{ matrix.check.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Ruff lint
            command: uv run --locked ruff check .
          - name: Ruff format
            command: uv run --locked ruff format --check .
          - name: uv lock
            command: uv lock --check --offline
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
          version: '0.13.6'
      - name: Install locked Python dependencies
        run: uv sync --locked
      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

  backend-tests:
    name: Backend / ${{ matrix.check.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Full pytest (SQLite and MongoDB)
            backend: sqlite
            command: uv run --locked python -m pytest -ra --tb=short
          - name: MongoDB repository contracts
            backend: mongo
            command: uv run --locked python -m pytest -ra --tb=short tests/storage/test_repository_contract.py
          - name: WebSocket loopback (SQLite and MongoDB)
            backend: sqlite
            command: uv run --locked python -m pytest -ra --tb=short tests/api/test_websocket.py -k test_dev_launcher_serves_real_websocket_over_loopback
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/?directConnection=true
      TWOWORLDS_TEST_BACKEND: ${{ matrix.check.backend }}
      # The outage fixture starts a separate container with --pull never.
      TWOWORLDS_TEST_MONGO_IMAGE: mongo:7.0.48
    services:
      mongo:
        image: mongo:7.0.48
        ports:
          - '127.0.0.1:27017:27017'
        options: >-
          --tmpfs /data/db:mode=1777
          --ulimit nofile=8192:8192
          --log-driver local
          --log-opt max-size=32k
          --log-opt max-file=2
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
          version: '0.13.6'
      - name: Install locked Python dependencies
        run: uv sync --locked
      - name: Verify Docker and MongoDB
        run: |
          docker version --format '{{.Server.Version}}'
          docker image inspect "$TWOWORLDS_TEST_MONGO_IMAGE" --format '{{.Id}}'
          uv run --locked python - <<'PY'
          import os
          from pymongo import MongoClient

          with MongoClient(os.environ["MONGO_URI"], serverSelectionTimeoutMS=5000) as client:
              client.admin.command("ping")
              print("MongoDB", client.server_info()["version"])
          PY
      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

  frontend:
    name: Frontend / ${{ matrix.check.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: TypeScript
            script: typecheck
          - name: Unit tests
            script: test:unit
          - name: Build
            script: build
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked npm dependencies
        run: npm ci
      - name: ${{ matrix.check.name }}
        run: npm run ${{ matrix.check.script }}

  deployment-smoke:
    name: Deployment / HTTPS and WSS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
          version: '0.13.6'
      - name: Validate Demo Compose
        run: docker compose -f compose.demo.yml config --quiet
      - name: Run isolated HTTPS, WSS, and MongoDB outage smoke
        working-directory: backend
        run: uv run --locked python -m tests.deployment_smoke

  database-recovery:
    name: Deployment / MongoDB recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
          version: '0.13.6'
      - name: Install ShellCheck and age
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck age
      - name: Check backup and restore scripts
        run: |
          for script in scripts/mongodb-*.sh; do bash -n "$script"; done
          shellcheck -x scripts/mongodb-*.sh
      - name: Pull the pinned MongoDB image
        run: docker pull mongo:7.0.48
      - name: Run authenticated backup and recovery drill
        working-directory: backend
        run: uv run --locked pytest tests/mongodb_recovery.py -v -s --tb=short

  acceptance-e2e:
    name: Acceptance / dual-browser (${{ matrix.storage }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        storage: [sqlite, mongo]
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/?directConnection=true
      T16_BROWSER: chromium
      T16_STORAGE: ${{ matrix.storage }}
    services:
      mongo:
        image: mongo:7.0.48
        ports:
          - '127.0.0.1:27017:27017'
        options: >-
          --tmpfs /data/db:mode=1777
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
          version: '0.13.6'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          (cd backend && uv sync --locked --group dev)
          (cd frontend && npm ci)
      - name: Install Playwright Chromium
        run: cd backend && uv run --locked python -m playwright install --with-deps chromium
      - name: Build frontend production bundle
        run: cd frontend && npm run build
      - name: Dual-browser acceptance (real API, WS and storage)
        run: cd frontend && ../backend/.venv/bin/python e2e/t16_dual_browser.py
      - name: Backup and restore drill (official Database Tools)
        if: matrix.storage == 'mongo'
        run: |
          cd backend
          MONGO_CONTAINER=$(docker ps --filter ancestor=mongo:7.0.48 --format '{{.Names}}' | head -1)
          export MONGO_CONTAINER
          uv run --locked python -m pytest tests/t16_backup_restore.py -q
