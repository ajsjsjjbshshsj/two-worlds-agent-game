server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vue Router client-side navigation
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA service worker and offline assets — must NOT be long-term cached.
    # These files do not carry content hashes, so they must always be re-validated.
    # This block must appear BEFORE the generic static-asset rule so that nginx
    # matches sw.js / manifest.webmanifest here (first-match wins for regex locations).
    location ~* (sw\.js|worker\.js|manifest\.webmanifest|offline\.html|offline\.js|offline\.css)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Static assets with content hashes — safe for long-term caching.
    # Vite injects a hash into every filename, so the URL changes on every update.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
