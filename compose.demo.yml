# TwoWorlds Local Demo Path Docker Compose
# Usage:
#   docker compose -f compose.demo.yml up -d
# Notes:
#   Runs standalone FastAPI + SQLite + Vue SPA.
#   Zero external AI calls, zero external cost.
#   Isolated from production MongoDB configuration.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TWOWORLDS_MODE: demo
      TWOWORLDS_STORAGE_BACKEND: sqlite
      TWOWORLDS_SQLITE_PATH: /data/twoworlds_demo.db
      TWOWORLDS_AI_MODE: demo
      TWOWORLDS_VERIFICATION_SECRET: ${TWOWORLDS_VERIFICATION_SECRET:-twoworlds-demo-verification-secret-32chars}
      TWOWORLDS_EMAIL_MODE: ${TWOWORLDS_EMAIL_MODE:-console}
      TWOWORLDS_ALLOWED_ORIGINS: ${TWOWORLDS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      TWOWORLDS_HOST: 0.0.0.0
      TWOWORLDS_PORT: 8000
    volumes:
      - sqlite_data:/data
    ports:
      - "8000:8000"
    networks:
      - twoworlds-demo-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - twoworlds-demo-net

volumes:
  sqlite_data:

networks:
  twoworlds-demo-net:
    driver: bridge
