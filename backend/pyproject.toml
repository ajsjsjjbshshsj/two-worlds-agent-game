[build-system]
requires = ["hatchling==1.27.0", "pydantic==2.14.1"]
build-backend = "hatchling.build"

[project]
name = "twoworlds-api"
version = "0.1.0"
description = "Backend foundation for TwoWorlds cooperative interactive stories."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi==25.1.0",
    "fastapi==0.132.0",
    "pydantic==2.14.1",
    "pymongo==4.19.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2",
  "ruff==0.15.4",
  "uvicorn==0.54.0",
  "websockets==16.0",
]

[tool.hatch.build]
exclude = ["**/tests/**", "**/work/**", "**/outputs/**", "**/.idea/**", "**/__pycache__/**", "**/*.pyc", "**/*.iml", "**/.env*", "**/*.pem", "**/*.key", "**/.stage-*/**", "**/.locks/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
include = ["/src/twoworlds/**/*.py"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/twoworlds/**/*.py",
  "/hatch_build.py",
  "/README.md",
  "/pyproject.toml",
  "/.python-version",
  "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
