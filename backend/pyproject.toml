[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "twoworlds-api"
version = "0.1.0"
description = "Backend foundation for TwoWorlds cooperative interactive stories."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "ruff==0.15.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/twoworlds"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/pyproject.toml",
  "/.python-version",
  "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
